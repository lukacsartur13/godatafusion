# GoDataFusion — static Vite build + one Web-standard function.
#
# The function's route is declared in the function file itself
# (`export const config = { path: '/api/project-request' }`), so there is
# no redirect table to keep in sync with the code.

[build]
  command  = "npm run build"
  publish  = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Clean URLs are real directories in dist/, so nothing is rewritten here.
# Only the 404 needs declaring.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
